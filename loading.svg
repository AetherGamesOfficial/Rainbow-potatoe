&lt;style&gt;
body {
    margin: 0;
    background: black;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.bubble-container {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.bubble {
    position: absolute;
    bottom: -50px;
    left: var(--start-x);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    opacity: var(--max-opacity);
    animation: floatUp var(--speed) linear infinite;
    animation-delay: var(--delay);
    background: var(--color);
    box-shadow: 0 0 15px var(--color);
}

@keyframes floatUp {
    0% {
        transform: translateY(0) translateX(0);
        opacity: var(--max-opacity);
    }
    50% {
        opacity: calc(var(--max-opacity) * 1.5);
    }
    100% {
        transform: translateY(-110vh) translateX(var(--drift-x));
        opacity: 0;
    }
}

.loader {
    position: relative;
    width: 100px;
    height: 100px;
    margin-bottom: 40px;
    z-index: 1;
}

.dot {
    position: absolute;
    width: 12px;
    height: 12px;

    background: white;
    border-radius: 50%;

    top: 50%;
    left: 50%;

    margin: -6px;

    animation: orbit 1.2s linear infinite;
}

.dot:nth-child(1) { animation-delay: 0s; opacity: 1; }
.dot:nth-child(2) { animation-delay: -0.1s; opacity: .92; }
.dot:nth-child(3) { animation-delay: -0.2s; opacity: .84; }
.dot:nth-child(4) { animation-delay: -0.3s; opacity: .76; }
