&lt;script&gt;
function getLoadingNextUrl() {
    const sources = [];
    if (typeof window.__AETHER_LAUNCH_HREF__ === &quot;string&quot;) sources.push(window.__AETHER_LAUNCH_HREF__);
    try { sources.push(window.parent.location.href); } catch {}
    sources.push(window.location.href);

    for (const source of sources) {
        try {
            const url = new URL(source, window.location.href);
            const next = url.searchParams.get(&quot;next&quot;) || url.searchParams.get(&quot;to&quot;);
            if (next) return next;
        } catch {}
    }
    return &quot;&quot;;
}

const loadingNextUrl = getLoadingNextUrl();
if (loadingNextUrl) {
    window.setTimeout(() =&gt; {
        try {
            window.parent.location.href = loadingNextUrl;
        } catch {
            window.location.href = loadingNextUrl;
        }
    }, 1400);
}
&lt;/script&gt;

