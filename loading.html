<!DOCTYPE html>
<html>
<head>
<style>
body {
    margin: 0;
    background: black;
    height: 100vh;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    overflow: hidden;
}

.bubble-container {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
}

.bubble {
    position: absolute;
    bottom: -50px;
    left: var(--start-x);
    width: var(--size);
    height: var(--size);
    border-radius: 50%;
    opacity: var(--max-opacity);
    animation: floatUp var(--speed) linear infinite;
    animation-delay: var(--delay);
    background: var(--color);
    box-shadow: 0 0 15px var(--color);
}

@keyframes floatUp {
    0% {
        transform: translateY(0) translateX(0);
        opacity: var(--max-opacity);
    }
    50% {
        opacity: calc(var(--max-opacity) * 1.5);
    }
    100% {
        transform: translateY(-110vh) translateX(var(--drift-x));
        opacity: 0;
    }
}

.loader {
    position: relative;
    width: 100px;
    height: 100px;
    margin-bottom: 40px;
    z-index: 1;
}

.dot {
    position: absolute;
    width: 12px;
    height: 12px;

    background: white;
    border-radius: 50%;

    top: 50%;
    left: 50%;

    margin: -6px;

    animation: orbit 1.2s linear infinite;
}

.dot:nth-child(1) { animation-delay: 0s; opacity: 1; }
.dot:nth-child(2) { animation-delay: -0.1s; opacity: .92; }
.dot:nth-child(3) { animation-delay: -0.2s; opacity: .84; }
.dot:nth-child(4) { animation-delay: -0.3s; opacity: .76; }
.dot:nth-child(5) { animation-delay: -0.4s; opacity: .68; }
.dot:nth-child(6) { animation-delay: -0.5s; opacity: .60; }
.dot:nth-child(7) { animation-delay: -0.6s; opacity: .52; }
.dot:nth-child(8) { animation-delay: -0.7s; opacity: .44; }
.dot:nth-child(9) { animation-delay: -0.8s; opacity: .36; }
.dot:nth-child(10){ animation-delay: -0.9s; opacity: .28; }
.dot:nth-child(11){ animation-delay: -1.0s; opacity: .20; }
.dot:nth-child(12){ animation-delay: -1.1s; opacity: .12; }

@keyframes orbit {
    from {
        transform: rotate(0deg) translateX(40px);
    }
    to {
        transform: rotate(360deg) translateX(40px);
    }
}

#message {
    color: white;
    font-size: 32px;
    font-family: "Courier New", monospace;
    text-align: center;
    max-width: 80%;
    z-index: 1;
}
</style>
</head>

<script>
function getLoadingNextUrl() {
    const sources = [];
    if (typeof window.__AETHER_LAUNCH_HREF__ === "string") sources.push(window.__AETHER_LAUNCH_HREF__);
    try { sources.push(window.parent.location.href); } catch {}
    sources.push(window.location.href);

    for (const source of sources) {
        try {
            const url = new URL(source, window.location.href);
            const next = url.searchParams.get("next") || url.searchParams.get("to");
            if (next) return next;
        } catch {}
    }
    return "";
}

const loadingNextUrl = getLoadingNextUrl();
if (loadingNextUrl) {
    window.setTimeout(() => {
        try {
            window.parent.location.href = loadingNextUrl;
        } catch {
            window.location.href = loadingNextUrl;
        }
    }, 1400);
}
