        &lt;span class=&quot;bubble&quot;&gt;&lt;/span&gt;
    &lt;/div&gt;

    &lt;nav class=&quot;appleseed&quot; aria-label=&quot;Navigation&quot;&gt;
        &lt;a class=&quot;nav-button&quot;  aria-label=&quot;Games&quot; href=&quot;https://cdn.jsdelivr.net/gh/AetherGamesOfficial/Rainbow-potatoe@main/enrichment.svg&quot; target=&quot;_parent&quot;&gt;
            &lt;svg viewBox=&quot;0 0 64 64&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M19 26h26c8 0 13 7 15 18 1 6-2 11-7 11-4 0-7-3-9-7H20c-2 4-5 7-9 7-5 0-8-5-7-11 2-11 7-18 15-18Zm4-9h18c3 0 6 2 6 5v2H17v-2c0-3 3-5 6-5Zm-5 20v5h-5v5h-4v-5H4v-5h5v-5h4v5h5Zm30-3a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6ZM40 36a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z&quot;/&gt;&lt;/svg&gt;
        &lt;/a&gt;
        &lt;a class=&quot;nav-button&quot;  aria-label=&quot;Home&quot; href=&quot;https://cdn.jsdelivr.net/gh/AetherGamesOfficial/Rainbow-potatoe@main/studyhub.svg&quot; target=&quot;_parent&quot;&gt;
            &lt;svg viewBox=&quot;0 0 64 64&quot; aria-hidden=&quot;true&quot;&gt;&lt;path d=&quot;M8 31 32 10l24 21v25H39V39H25v17H8V31Zm36-18h10v15L44 19v-6Z&quot;/&gt;&lt;/svg&gt;
