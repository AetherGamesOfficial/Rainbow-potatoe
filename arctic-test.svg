        &lt;/a&gt;
    &lt;/nav&gt;

    &lt;main class=&quot;wrap&quot;&gt;
        &lt;form class=&quot;panel&quot; id=&quot;testForm&quot;&gt;
            &lt;input id=&quot;targetInput&quot; value=&quot;https://example.com&quot; placeholder=&quot;https://example.com&quot; autocomplete=&quot;off&quot; spellcheck=&quot;false&quot;&gt;
            &lt;select id=&quot;cdnInput&quot; aria-label=&quot;CDN origin&quot;&gt;
                &lt;option value=&quot;https://cdn.jsdelivr.net/gh/sealiee11/arctic-static@main&quot;&gt;jsDelivr&lt;/option&gt;
                &lt;option value=&quot;https://testingcf.jsdelivr.net/gh/sealiee11/arctic-static@main&quot;&gt;testingcf&lt;/option&gt;
                &lt;option value=&quot;https://gcore.jsdelivr.net/gh/sealiee11/arctic-static@main&quot;&gt;gcore&lt;/option&gt;
            &lt;/select&gt;
            &lt;button class=&quot;test-button&quot; type=&quot;submit&quot;&gt;test&lt;/button&gt;
        &lt;/form&gt;
        &lt;div class=&quot;status&quot; id=&quot;status&quot;&gt;ready&lt;/div&gt;
        &lt;section class=&quot;frame-shell&quot;&gt;
            &lt;iframe id=&quot;testFrame&quot; allow=&quot;autoplay; fullscreen; clipboard-read; clipboard-write; encrypted-media; picture-in-picture&quot;&gt;&lt;/iframe&gt;
        &lt;/section&gt;
    &lt;/main&gt;

    &lt;script&gt;
        const frame = document.getElementById(&quot;testFrame&quot;);
        const form = document.getElementById(&quot;testForm&quot;);
        const targetInput = document.getElementById(&quot;targetInput&quot;);
        const cdnInput = document.getElementById(&quot;cdnInput&quot;);
        const status = document.getElementById(&quot;status&quot;);

        function encodeTarget(value) {
            const bytes = new TextEncoder().encode(value);
            let text = &quot;&quot;;
            for (const byte of bytes) text += String.fromCharCode(byte);
            return &quot;aw1.&quot; + btoa(text).replace(/\+/g, &quot;-&quot;).replace(/\//g, &quot;_&quot;).replace(/=+$/g, &quot;&quot;);
        }

        function normalizeTarget(value) {
            const trimmed = value.trim();
            if (/^https?:\/\//i.test(trimmed)) return trimmed;
            if (trimmed.includes(&quot;.&quot;) &amp;&amp; !trimmed.includes(&quot; &quot;)) return &quot;https://&quot; + trimmed;
            return &quot;https://www.google.com/search?q=&quot; + encodeURIComponent(trimmed);
        }

        function loadTest(rawValue) {
            const target = normalizeTarget(rawValue);
            const base = cdnInput.value.replace(/\/+$/, &quot;&quot;);
            frame.src = base + &quot;/embed.svg?backend=scramjet2&amp;palette=gnmath#&quot; + encodeTarget(target);
            status.textContent = &quot;loading &quot; + target;
        }

        form.addEventListener(&quot;submit&quot;, (event) =&gt; {
            event.preventDefault();
            loadTest(targetInput.value);
        });

        window.addEventListener(&quot;message&quot;, (event) =&gt; {
            if (event.data &amp;&amp; event.data.type === &quot;arctic-embed&quot;) {
                status.textContent = event.data.status + (event.data.detail ? &quot;: &quot; + event.data.detail : &quot;&quot;);
            }
        });
    &lt;/script&gt;
&lt;/body&gt;
