            min-height: 22px;
            font-size: 14px;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.65);
        }

        @media (max-width: 760px) {
            .panel {
                top: 112px;
                grid-template-columns: 1fr;
            }

            .wrap {
                padding-top: 330px;
