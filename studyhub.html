<!DOCTYPE html>
<html>
<head>
    <title>AETHER</title>
    <link rel="icon" type="image/png" href="aether-favicon.png">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212 url("aether background.png") center / cover fixed no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .button-wrapper {
            display: flex;
            gap: 40px;
            margin-top: 40px;
            z-index: 10;
        }

        .Medeviscool, .VenomOnTop, .deveriono {
            background: rgba(255, 255, 255, 0.05); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); 
            border-color: #ffffff; 
            border-radius: 20px;
            padding: 20px 30px;
            border-width: 5px;
            border-style: solid;
            color: white;
            font-family: 'Courier New', Courier, monospace;
            font-size: 18px;
            cursor: pointer;
            transition: all 1s ease;
            text-decoration: none; 
            display: inline-block;
        }

        .nav-action {
            width: 56px;
            height: 52px;
            padding: 0;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-action:hover {
            transform: scale(1.12);
            opacity: 0.8;
        }

        .controller-svg {
            width: 58px;
            height: 42px;
            display: block;
        }

        .Medeviscool:hover, .VenomOnTop:hover, .deveriono:hover {
            transform: scale(1.1);
            background-color: #b3b1b1; 
        }

        .controller-icon {
            position: relative;
            width: 50px;
            height: 29px;
            border: 3px solid #ffffff;
            border-radius: 20px 20px 14px 14px;
            box-sizing: border-box;
            transform: translateX(0);
        }

        .controller-icon::before,
        .controller-icon::after {
            content: "";
            position: absolute;
            top: 12px;
            width: 13px;
            height: 20px;
            border: 3px solid #ffffff;
            border-top: 0;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px); 
            box-sizing: border-box;
        }

        .controller-icon::before {
            left: -9px;
            border-radius: 0 0 13px 13px;
            transform: rotate(15deg);
        }

        .controller-icon::after {
            right: -9px;
            border-radius: 0 0 13px 13px;
            transform: rotate(-15deg);
        }

        .controller-bumper {
            position: absolute;
            top: -8px;
            width: 16px;
            height: 9px;
            border: 3px solid #ffffff;
            border-bottom: 0;
            border-radius: 12px 12px 0 0;
            background: black;
            box-sizing: border-box;
        }

        .controller-bumper.left {
            left: 5px;
            transform: rotate(-10deg);
        }

        .controller-bumper.right {
            right: 5px;
            transform: rotate(10deg);
        }

        .controller-stick,
        .controller-button,
        .controller-dot {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
        }

        .controller-stick {
            left: 7px;
            top: 8px;
            width: 7px;
            height: 7px;
        }

        .controller-button {
            right: 10px;
            top: 15px;
            width: 7px;
            height: 7px;
        }

        .controller-dot.one {
            right: 13px;
            top: 7px;
            width: 4px;
            height: 4px;
        }

        .controller-dot.two {
            right: 7px;
            top: 11px;
            width: 4px;
            height: 4px;
        }

        .controller-plus {
            position: absolute;
            left: 19px;
            top: 15px;
            width: 10px;
            height: 10px;
        }

        .controller-plus::before,
        .controller-plus::after {
            content: "";
            position: absolute;
            background: #ffffff;
            border-radius: 2px;
        }

        .controller-plus::before {
            left: 0;
            top: 4px;
            width: 10px;
            height: 3px;
        }

        .controller-plus::after {
            left: 4px;
            top: 0;
            width: 3px;
            height: 10px;
        }

        .controller-slot {
            position: absolute;
            top: 8px;
            width: 5px;
            height: 3px;
            background: #ffffff;
            border-radius: 4px;
        }

        .controller-slot.left {
            left: 20px;
        }

        .controller-slot.right {
            left: 28px;
        }

        .apps-icon {
            position: relative;
            width: 34px;
            height: 34px;
        }

        .apps-square {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .apps-square.one {
            left: 0;
            top: 0;
        }

        .apps-square.two {
            right: 0;
            top: 0;
        }

        .apps-square.three {
            left: 0;
            bottom: 0;
        }

        .apps-plus {
            position: absolute;
            right: 1px;
            bottom: 1px;
            width: 14px;
            height: 14px;
        }

        .apps-plus::before,
        .apps-plus::after {
            content: "";
            position: absolute;
            background: #ffffff;
            border-radius: 2px;
        }

        .apps-plus::before {
            left: 0;
            top: 5px;
            width: 14px;
            height: 4px;
        }

        .apps-plus::after {
            left: 5px;
            top: 0;
            width: 4px;
            height: 14px;
        }

        .appleseed {
            position: absolute;
            top: 15px; 
            left: 50%;
            transform: translateX(-50%);
            background-color: #1a1a1a;
            border-radius: 20px;
            padding: 10px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffffff; 
            z-index: 50;
            min-width: 320px;
            gap: 22px;
        }

        .homebutton {
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .homebutton:hover {
            transform: scale(1.15);
            opacity: 0.8;
        }

        .home-icon {
            position: relative;
            display: block;
            width: 38px;
            height: 34px;
        }

        .home-icon::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 12px;
            width: 30px;
            height: 22px;
            background: #ffffff;
            clip-path: polygon(0 0, 50% 0, 100% 0, 100% 100%, 63% 100%, 63% 54%, 37% 54%, 37% 100%, 0 100%);
        }

        .home-icon::after {
            content: "";
            position: absolute;
            left: 2px;
            top: 0;
            width: 34px;
            height: 28px;
            background: #ffffff;
            clip-path: polygon(50% 0, 100% 58%, 90% 68%, 50% 24%, 10% 68%, 0 58%);
        }

        .home-chimney {
            position: absolute;
            right: 5px;
            top: 3px;
            width: 8px;
            height: 15px;
            background: #ffffff;
            border-radius: 2px 2px 0 0;
        }

        .Aetherlogo {
            transition: all 0.9s ease;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8); 
            color: #ffffff; 
            font-family: 'Courier New', Courier, monospace;
            font-size: 150px;
            margin: 0;
            z-index: 10;
        }

        .Aetherlogo:hover {
            transform: scale(1.1);
            color: #ffffff;
            text-shadow: 0 0 40px rgba(255, 255, 255, 0.9);
        }

        .bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            left: var(--start-x);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            opacity: var(--max-opacity);
            animation: floatUp var(--speed) linear infinite;
            animation-delay: var(--delay);
            background: var(--color);
            box-shadow: 0 0 15px var(--color);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0);
                opacity: var(--max-opacity);
            }
            50% {
                opacity: calc(var(--max-opacity) * 1.5);
            }
            100% {
                transform: translateY(-110vh) translateX(var(--drift-x));
                opacity: 0;
            }
        }
        .settings-svg {
            width: 42px;
            height: 42px;
            display: block;
        }
        .appleseed {
            background: rgba(0, 0, 0, 0.35) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .Medeviscool,
        .VenomOnTop,
        .deveriono {
            background: rgba(0, 0, 0, 0.35) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .Medeviscool:hover,
        .VenomOnTop:hover,
        .deveriono:hover {
            background: rgba(255, 255, 255, 0.12) !important;
        }
    </style>
</head>
<body>
    <script src="page-loader.js"></script>
    <nav class="appleseed">
        <button class="nav-action" onclick="window.location.href='enrichment.html'" title="Games" aria-label="Games">
            <svg class="controller-svg" aria-hidden="true" viewBox="0 0 96 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 20C17 22 13 33 9 49C8 55 18 58 22 51L30 37H66L74 51C78 58 88 55 87 49C83 33 79 22 72 20C62 17 34 17 24 20Z" stroke="white" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
                <circle cx="31" cy="30" r="5" fill="white"/>
                <circle cx="64" cy="30" r="4" fill="white"/>
                <circle cx="73" cy="35" r="4" fill="white"/>
                <path d="M40 42H52M46 36V48" stroke="white" stroke-width="5" stroke-linecap="round"/>
                <path d="M44 27H49M57 27H62" stroke="white" stroke-width="5" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="homebutton" onclick="window.location.href='studyhub.html'" title="Home" aria-label="Home">
            <span class="home-icon" aria-hidden="true"><span class="home-chimney"></span></span>

        <button class="nav-action" onclick="window.location.href='resources.html'" title="Apps" aria-label="Apps">
            <span class="apps-icon" aria-hidden="true">
                <span class="apps-square one"></span>
                <span class="apps-square two"></span>

            </span>
        </button>
        <button class="nav-action settings-action" onclick="window.location.href='settings.html'" type="button" title="Settings" aria-label="Settings">
            <svg class="settings-svg" aria-hidden="true" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M29 4H35L37 11.5C39.2 12.1 41.2 13 43 14.1L49.7 10.2L53.8 14.3L49.9 21C51 22.8 51.9 24.8 52.5 27L60 29V35L52.5 37C51.9 39.2 51 41.2 49.9 43L53.8 49.7L49.7 53.8L43 49.9C41.2 51 39.2 51.9 37 52.5L35 60H29L27 52.5C24.8 51.9 22.8 51 21 49.9L14.3 53.8L10.2 49.7L14.1 43C13 41.2 12.1 39.2 11.5 37L4 35V29L11.5 27C12.1 24.8 13 22.8 14.1 21L10.2 14.3L14.3 10.2L21 14.1C22.8 13 24.8 12.1 27 11.5L29 4Z" fill="white"/>
                <circle cx="32" cy="32" r="9" fill="#121212" opacity="0.8"/>
            </svg>
        </button>
    </nav>

    <h1 class="Aetherlogo">AETHER</h1>
    
    <div class="button-wrapper">
        <button class="Medeviscool" onclick="window.location.href='enrichment.html'">g@m3s</button>
        <button class="VenomOnTop" onclick="window.location.href='resources.html'">@pps</button>
        <button class="deveriono" onclick="window.location.href='research.html'">s3arch</button>
    </div>

    <div class="bubble-container">
        <div class="bubble" style="--start-x: 5%;  --drift-x: 40px;  --size: 14px; --speed: 9s;  --delay: 0s;   --max-opacity: 0.6; --color: #00b4d8;"></div>
        <div class="bubble" style="--start-x: 12%; --drift-x: -30px; --size: 26px; --speed: 13s; --delay: 4s;   --max-opacity: 0.5; --color: #7209b7;"></div>
        <div class="bubble" style="--start-x: 22%; --drift-x: 50px;  --size: 16px; --speed: 8s;  --delay: 1.5s; --max-opacity: 0.7; --color: #00f5d4;"></div>
        <div class="bubble" style="--start-x: 35%; --drift-x: -45px; --size: 32px; --speed: 16s; --delay: 7s;   --max-opacity: 0.4; --color: #2ec4b6;"></div>
        <div class="bubble" style="--start-x: 48%; --drift-x: 25px;  --size: 18px; --speed: 10s; --delay: 2s;   --max-opacity: 0.6; --color: #7209b7;"></div>
        <div class="bubble" style="--start-x: 55%; --drift-x: -35px; --size: 12px; --speed: 7s;  --delay: 5.5s; --max-opacity: 0.5; --color: #00b4d8;"></div>
        <div class="bubble" style="--start-x: 68%; --drift-x: 60px;  --size: 28px; --speed: 14s; --delay: 0.8s; --max-opacity: 0.6; --color: #00f5d4;"></div>
        <div class="bubble" style="--start-x: 76%; --drift-x: -20px; --size: 15px; --speed: 9s;  --delay: 3.2s; --max-opacity: 0.7; --color: #2ec4b6;"></div>
        <div class="bubble" style="--start-x: 85%; --drift-x: 45px;  --size: 22px; --speed: 11s; --delay: 6s;   --max-opacity: 0.5; --color: #7209b7;"></div>
        <div class="bubble" style="--start-x: 93%; --drift-x: -40px; --size: 13px; --speed: 8s;  --delay: 1.8s; --max-opacity: 0.6; --color: #00b4d8;"></div>
    </div>

    <script src="search.js" defer></script>
<script>
(() => {
    function createAetherStore() {
    const memory = new Map();
    try {
        const key = "__aether_storage_test__";
        window.localStorage.setItem(key, "1");
        window.localStorage.removeItem(key);
        return window.localStorage;
    } catch {
        return {
            getItem: (key) => memory.has(key) ? memory.get(key) : null,
            setItem: (key, value) => { memory.set(key, String(value)); },
            removeItem: (key) => { memory.delete(key); }
        };
    }
}
const store = createAetherStore();
    const bgMap = {
        default: '#121212 url("aether background.png") center / cover fixed no-repeat',
        night: 'linear-gradient(135deg, #050505, #122033 58%, #12051f) fixed',
        ocean: 'linear-gradient(135deg, #001219, #005f73, #0a9396) fixed',
        none: '#121212'
    };
    const custom = (store.getItem('aether.settings.customBg') || '').trim();
    const mode = store.getItem('aether.settings.bg') || 'default';
    const bg = custom ? `#121212 url("${custom.replace(/"/g, '%22')}") center / cover fixed no-repeat` : (bgMap[mode] || bgMap.default);
    document.documentElement.style.background = bg;
    document.body.style.background = bg;
    document.querySelectorAll('.settings-action').forEach(button => {
        button.addEventListener('click', () => { window.location.href = 'settings.html'; });
    });
})();
</script>
</body>
</html>
