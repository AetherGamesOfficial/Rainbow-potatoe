<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activities</title>
    <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #121212 url("aether background.png") center / cover fixed no-repeat;
            color: white;
            font-family: "Courier New", Courier, monospace;
        }

        .bubble-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        .bubble {
            position: absolute;
            bottom: -50px;
            left: var(--start-x);
            width: var(--size);
            height: var(--size);
            border-radius: 50%;
            opacity: var(--max-opacity);
            animation: floatUp var(--speed) linear infinite;
            animation-delay: var(--delay);
            background: var(--color);
            box-shadow: 0 0 15px var(--color);
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) translateX(0);
                opacity: var(--max-opacity);
            }
            50% {
                opacity: calc(var(--max-opacity) * 1.5);
            }
            100% {
                transform: translateY(-110vh) translateX(var(--drift-x));
                opacity: 0;
            }
        }

        .activities-shell {
            position: absolute;
            inset: 0;
            z-index: 1;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            padding: 102px 28px 28px;
            gap: 20px;
        }

        .activities-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        .activities-title {
            margin: 0;
            color: #ffffff;
            font-size: 42px;
            line-height: 1;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        }

        .activity-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .activity-input,
        .activity-select,
        .activity-button {
            background-color: black;
            border: 4px solid white;
            border-radius: 20px;
            color: white;
            font: inherit;
            font-size: 16px;
            outline: none;
        }

        .activity-input {
            width: min(560px, 62vw);
            padding: 12px 18px;
        }

        .activity-select,
        .activity-button {
            padding: 12px 16px;
            cursor: pointer;
        }

        .activity-button {
            transition: all 0.2s ease;
        }

        .activity-button:hover {
            transform: scale(1.05);
            background-color: #222;
        }

        .status {
            min-height: 20px;
            color: #ffffff;
            font-size: 14px;
            text-shadow: 0 0 12px rgba(255, 255, 255, 0.4);
        }

        .games-grid {
            min-height: 0;
            overflow: auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            padding-right: 6px;
        }

        .game-card {
            min-height: 190px;
            background-color: black;
            border: 4px solid white;
            border-radius: 20px;
            color: white;
            cursor: pointer;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: all 0.2s ease;
        }

        .game-card:hover {
            transform: scale(1.03);
            background-color: #222;
        }

        .game-card img {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            background: #111;
        }

        .game-card span {
            padding: 10px;
            font-size: 14px;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        .appleseed {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #1a1a1a;
            border-radius: 20px;
            padding: 10px 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ffffff;
            z-index: 50;
            min-width: 320px;
            gap: 22px;
        }

        .homebutton {
            background: transparent;
            border: none;
            cursor: pointer;
            outline: none;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .homebutton:hover {
            transform: scale(1.15);
            opacity: 0.8;
        }

        .home-icon {
            position: relative;
            display: block;
            width: 38px;
            height: 34px;
        }

        .home-icon::before {
            content: "";
            position: absolute;
            left: 4px;
            top: 12px;
            width: 30px;
            height: 22px;
            background: #ffffff;
            clip-path: polygon(0 0, 50% 0, 100% 0, 100% 100%, 63% 100%, 63% 54%, 37% 54%, 37% 100%, 0 100%);
        }

        .home-icon::after {
            content: "";
            position: absolute;
            left: 2px;
            top: 0;
            width: 34px;
            height: 28px;
            background: #ffffff;
            clip-path: polygon(50% 0, 100% 58%, 90% 68%, 50% 24%, 10% 68%, 0 58%);
        }

        .home-chimney {
            position: absolute;
            right: 5px;
            top: 3px;
            width: 8px;
            height: 15px;
            background: #ffffff;
            border-radius: 2px 2px 0 0;
        }

        .nav-action {
            width: 56px;
            height: 52px;
            padding: 0;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        .nav-action:hover {
            transform: scale(1.12);
            opacity: 0.8;
        }

        .controller-svg {
            width: 58px;
            height: 42px;
            display: block;
        }

        .controller-icon {
            position: relative;
            width: 50px;
            height: 29px;
            border: 3px solid #ffffff;
            border-radius: 20px 20px 14px 14px;
            box-sizing: border-box;
            transform: translateX(0);
        }

        .controller-icon::before,
        .controller-icon::after {
            content: "";
            position: absolute;
            top: 12px;
            width: 13px;
            height: 20px;
            border: 3px solid #ffffff;
            border-top: 0;
            background: black;
            box-sizing: border-box;
        }

        .controller-icon::before {
            left: -9px;
            border-radius: 0 0 13px 13px;
            transform: rotate(15deg);
        }

        .controller-icon::after {
            right: -9px;
            border-radius: 0 0 13px 13px;
            transform: rotate(-15deg);
        }

        .controller-bumper {
            position: absolute;
            top: -8px;
            width: 16px;
            height: 9px;
            border: 3px solid #ffffff;
            border-bottom: 0;
            border-radius: 12px 12px 0 0;
            background: black;
            box-sizing: border-box;
        }

        .controller-bumper.left {
            left: 5px;
            transform: rotate(-10deg);
        }

        .controller-bumper.right {
            right: 5px;
            transform: rotate(10deg);
        }

        .controller-stick,
        .controller-button,
        .controller-dot {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
        }

        .controller-stick {
            left: 7px;
            top: 8px;
            width: 7px;
            height: 7px;
        }

        .controller-button {
            right: 10px;
            top: 15px;
            width: 7px;
            height: 7px;
        }

        .controller-dot.one {
            right: 13px;
            top: 7px;
            width: 4px;
            height: 4px;
        }

        .controller-dot.two {
            right: 7px;
            top: 12px;
            width: 4px;
            height: 4px;
        }

        .controller-plus {
            position: absolute;
            left: 19px;
            top: 15px;
            width: 10px;
            height: 10px;
        }

        .controller-plus::before,
        .controller-plus::after {
            content: "";
            position: absolute;
            background: #ffffff;
            border-radius: 2px;
        }

        .controller-plus::before {
            left: 0;
            top: 4px;
            width: 10px;
            height: 3px;
        }

        .controller-plus::after {
            left: 4px;
            top: 0;
            width: 3px;
            height: 10px;
        }

        .controller-slot {
            position: absolute;
            top: 8px;
            width: 5px;
            height: 3px;
            background: #ffffff;
            border-radius: 4px;
        }

        .controller-slot.left {
            left: 20px;
        }

        .controller-slot.right {
            left: 28px;
        }

        .apps-icon {
            position: relative;
            width: 34px;
            height: 34px;
        }

        .apps-square {
            position: absolute;
            width: 12px;
            height: 12px;
            border: 3px solid #ffffff;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .apps-square.one {
            left: 0;
            top: 0;
        }

        .apps-square.two {
            right: 0;
            top: 0;
        }

        .apps-square.three {
            left: 0;
            bottom: 0;
        }

        .apps-plus {
            position: absolute;
            right: 1px;
            bottom: 1px;
            width: 14px;
            height: 14px;
        }

        .apps-plus::before,
        .apps-plus::after {
            content: "";
            position: absolute;
            background: #ffffff;
            border-radius: 2px;
        }

        .apps-plus::before {
            left: 0;
            top: 5px;
            width: 14px;
            height: 4px;
        }

        .apps-plus::after {
            left: 5px;
            top: 0;
            width: 4px;
            height: 14px;
        }

        @media (max-width: 720px) {
            .activities-shell {
                padding: 96px 18px 18px;
            }

            .activities-header,
            .activity-actions {
                align-items: stretch;
                flex-direction: column;
            }

            .activity-input {
                width: auto;
            }

            .activities-title {
                font-size: 34px;
            }
        }
    
        button {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }    
        .appleseed,
        .nav-action,
        .homebutton {
            background: rgba(255, 255, 255, 0.05) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .nav-action,
        .homebutton {
            border-radius: 12px;
        }

        .controller-svg,
        .home-icon,
        .apps-icon {
            background: transparent !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .appleseed .nav-action,
        .appleseed .homebutton,
        .appleseed .controller-svg,
        .appleseed .home-icon,
        .appleseed .apps-icon {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            box-shadow: none !important;
        }
        .settings-svg {
            width: 42px;
            height: 42px;
            display: block;
        }
        .appleseed {
            background: rgba(0, 0, 0, 0.35) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
        }

        .Medeviscool,
        .VenomOnTop,
        .deveriono {
            background: rgba(0, 0, 0, 0.35) !important;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

        .Medeviscool:hover,
        .VenomOnTop:hover,
        .deveriono:hover {
            background: rgba(255, 255, 255, 0.12) !important;
        }

    </style>
</head>

                parentHref = window.parent && window.parent !== window ? window.parent.location.href : "";
            } catch {}

            const currentHref = [window.location.href, document.referrer, parentHref].join(" ");
            const isStatic = currentHref.includes("/gh/AetherGamesOfficial/") || currentHref.includes(".svg");
            return isStatic ? staticCdnBase + page.replace(/\.html$/, ".svg") : page;
        }

        function getLoadingHandoffUrl(destination) {
            return `${getStaticPageUrl("loading.html")}?next=${encodeURIComponent(destination)}`;
        }

        function unwrapLaunchTarget(value) {
            const text = String(value || "").trim();
            try {
                const parsed = new URL(text, window.location.href);
                const wrapped = parsed.searchParams.get("goto");
                return wrapped ? decodeURIComponent(wrapped) : text;
            } catch {
                const match = text.match(/[?&]goto=([^&#]+)/);
                return match ? decodeURIComponent(match[1]) : text;
            }
        }

        function setStatus(message) {
            statusEl.textContent = message;
        }

        function showGameLoader() {
            let loader = document.getElementById("game-loader");
            if (loader) {
                loader.style.opacity = "1";
                return loader;
            }

            loader = document.createElement("iframe");
            loader.id = "game-loader";
            loader.title = "Loading";
            loader.src = getStaticPageUrl("loading.html");
            loader.setAttribute("aria-hidden", "true");
            loader.style.cssText = [
                "position:fixed",
                "inset:0",
                "width:100vw",
                "height:100vh",
                "border:0",
                "z-index:2147483647",
                "background:#000",
                "opacity:1",
                "transition:opacity 520ms ease",
                "pointer-events:auto",
            ].join(";");
            document.body.prepend(loader);
            return loader;
        }

        function hideGameLoader() {
            const loader = document.getElementById("game-loader");
            if (!loader) return;
            loader.style.opacity = "0";
            window.setTimeout(() => loader.remove(), 560);
        }

        function normalizeGames(result) {
            if (Array.isArray(result)) return result;
            return result?.games || [];
        }

        function normalizeGnMathZone(zone) {
            const url = String(zone.url || "")
                .replaceAll("{COVER_URL}", gnMathCoverUrl)
                .replaceAll("{HTML_URL}", gnMathHtmlUrl);
            const cover = String(zone.cover || "")
                .replaceAll("{COVER_URL}", gnMathCoverUrl)
                .replaceAll("{HTML_URL}", gnMathHtmlUrl);
            const special = Array.isArray(zone.special) && zone.special.length
                ? `GN Math ${zone.special[0]}`
                : "GN Math";

            return {
                id: `gn-${zone.id}`,
                name: zone.name || `GN Math ${zone.id}`,
                category: special,
                cover_url: cover,
                html_url: url,
                source: "gn-math",
                author: zone.author || ""
            };
        }

        async function fetchJsonFromAny(urls) {
            let lastError = null;
            for (const url of urls) {
                try {
                    const response = await fetch(`${url}${url.includes("?") ? "&" : "?"}t=${Date.now()}`);
                    if (!response.ok) throw new Error(`${response.status} ${response.statusText}`);
                    return await response.json();
                } catch (err) {
                    lastError = err;
                }
            }
            throw lastError || new Error("Could not fetch catalog.");
        }

        async function loadGnMathGames() {
            const zones = await fetchJsonFromAny(gnMathZonesUrls);
            return zones
                .filter((zone) => zone?.id !== undefined && zone?.name && zone?.url)
                .map(normalizeGnMathZone);
        }

        function withTimeout(promise, timeout, message) {
            let timeoutId;
            const timeoutPromise = new Promise((_, reject) => {
                timeoutId = setTimeout(() => reject(new Error(message)), timeout);
            });

            return Promise.race([promise, timeoutPromise]).finally(() => clearTimeout(timeoutId));
        }

        function getCachedLuminDirectory() {
            try {
                const cached = sessionStorage.getItem(luminDirectoryCacheKey);
                if (!cached) return null;
                const parsed = JSON.parse(cached);
                if (!parsed || !Array.isArray(parsed.games) || !parsed.games.length) return null;
                return parsed;
            } catch {
                return null;
            }
        }

        function setCachedLuminDirectory(games, total) {
            try {
                sessionStorage.setItem(luminDirectoryCacheKey, JSON.stringify({ games, total }));
            } catch {}
        }

        async function retryLumin(operation, attempts = 4) {
            let lastError = null;
            for (let attempt = 1; attempt <= attempts; attempt++) {
                try {
                    return await operation();
                } catch (err) {
                    lastError = err;
                    if (attempt === attempts) break;
                    await new Promise((resolve) =>
                        setTimeout(resolve, 250 * Math.pow(2, attempt - 1) + Math.floor(Math.random() * 200))
                    );
                }
            }
            throw lastError;
        }

        async function loadLuminSdk() {
            if (window.Lumin) return;

            await new Promise((resolve, reject) => {
                const script = document.createElement("script");
                script.src = "https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js";
                script.async = true;
                script.onload = resolve;
                script.onerror = () => reject(new Error("Lumin SDK failed to load."));
                document.head.appendChild(script);
            });
        }

        async function getGamesPage(page) {
            const result = await retryLumin(() => Lumin.getGames({ page, limit: luminPageLimit, q: "" }));
            const games = normalizeGames(result);
            const total = Number(result?.total || games.length);
            const pages = Number(result?.pages || Math.ceil(total / luminPageLimit) || 1);
            return { games, pages, total };
        }

        function updateCategories(categories) {
            categoryFilter.innerHTML = '<option value="">All</option>';
            for (const category of categories) {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            }
        }

        function categoriesFromGames(games) {
            return [...new Set(games.map((game) => game.category).filter(Boolean))].sort();
        }

        function mergeLuminGames(games) {
            const seen = new Set(allGames.map((game) => game.id));
            const freshGames = games.filter((game) => game?.id && !seen.has(game.id));
            if (!freshGames.length) return false;

            allGames = allGames.concat(freshGames);
            return true;
        }

        function mergeCatalogGames(games) {
            const seen = new Set(allGames.map((game) => game.id));
            const freshGames = games.filter((game) => game?.id && !seen.has(game.id));
            if (!freshGames.length) return false;

            allGames = allGames.concat(freshGames);
            return true;
        }

        async function loadRemainingLuminPages(startPage) {
            for (let page = startPage; page <= luminTotalPages; page += 3) {
                const batch = await Promise.all(
                    Array.from({ length: Math.min(3, luminTotalPages - page + 1) }, (_, index) =>
                        getGamesPage(page + index).catch(() => ({ games: [] }))
                    )
                );

                const nextGames = batch.flatMap((result) => result.games);
                if (!nextGames.length || !mergeLuminGames(nextGames)) continue;

                const fetchedCount = luminTotalGames ? Math.min(allGames.length, luminTotalGames) : allGames.length;
                updateCategories(categoriesFromGames(allGames));
                setCachedLuminDirectory(allGames, luminTotalGames);
                setStatus(luminTotalGames ? `Loading Lumin games: ${fetchedCount} of ${luminTotalGames}` : `Loading Lumin games: ${allGames.length}`);
                refreshGames();
                await new Promise((resolve) => setTimeout(resolve, 40));
            }

            setStatus(`${allGames.length} games`);
        }

        function normalizeCategories(result) {
            if (Array.isArray(result)) return result;
            return result?.categories || result?.data || [];
        }

        function getFallbackImage(game) {
            const label = game.name
                .slice(0, 18)
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
            const categoryName = game.category || "Games";
            const category = categoryName
                .toUpperCase()
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;");
            const palette = {
                Puzzle: ["#00f5d4", "#7209b7", "#00b4d8"],
                Arcade: ["#ff006e", "#00b4d8", "#7209b7"],
                Action: ["#f72585", "#ffbe0b", "#3a0ca3"],
                Driving: ["#2ec4b6", "#00b4d8", "#111111"],
                Sports: ["#80ed99", "#00b4d8", "#7209b7"],
                Strategy: ["#4cc9f0", "#4361ee", "#111111"],
                Creative: ["#00f5d4", "#2ec4b6", "#7209b7"],
                Trivia: ["#fdd85d", "#00b4d8", "#7209b7"],
            };
            const colors = palette[categoryName] || ["#00b4d8", "#7209b7", "#00f5d4"];
            const initials = game.name
                .split(/[\s.-]+/)
                .filter(Boolean)
                .slice(0, 2)
                .map((word) => word[0].toUpperCase())
                .join("");
            const svg = `
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
                    <defs>
                        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#050505"/>
                            <stop offset="1" stop-color="#151515"/>
                        </linearGradient>
                        <filter id="glow">
                            <feGaussianBlur stdDeviation="6" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                    <rect width="300" height="300" fill="url(#bg)"/>
                    <rect x="18" y="18" width="264" height="264" rx="24" fill="none" stroke="white" stroke-width="8"/>
                    <circle cx="76" cy="78" r="34" fill="${colors[0]}" opacity=".85" filter="url(#glow)"/>
                    <circle cx="230" cy="224" r="42" fill="${colors[1]}" opacity=".82" filter="url(#glow)"/>
                    <circle cx="222" cy="78" r="20" fill="${colors[2]}" opacity=".9" filter="url(#glow)"/>
                    <text x="150" y="130" text-anchor="middle" fill="white" font-family="Courier New, monospace" font-size="62" font-weight="700" filter="url(#glow)">${initials}</text>
                    <text x="150" y="190" text-anchor="middle" fill="white" font-family="Courier New, monospace" font-size="24" font-weight="700">${label}</text>
                    <text x="150" y="226" text-anchor="middle" fill="${colors[0]}" font-family="Courier New, monospace" font-size="15" font-weight="700">${category}</text>
                </svg>
            `;

            return `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
        }

        async function getLuminImageUrl(token) {
            return retryLumin(() => Lumin.getImageUrl(token), 6);
        }

        async function loadImages(games) {
            await Promise.all(games.map(async (game) => {
                if (game.cover_url) {
                    imageUrls[game.id] = game.cover_url;
                    return;
                }

                if (game.url && !game.image_token) {
                    imageUrls[game.id] = getFallbackImage(game);
                    return;
                }

                if (!game.image_token || imageUrls[game.id] || !window.Lumin) return;
                try {
                    imageUrls[game.id] = await getLuminImageUrl(game.image_token);
                } catch {
                    imageUrls[game.id] = "";
                }
            }));
        }

        function watchImage(image, game) {
            if (!imageObserver) {
                imageObserver = new IntersectionObserver((entries) => {
                    for (const entry of entries) {
                        if (!entry.isIntersecting) continue;

                        const target = entry.target;
                        imageObserver.unobserve(target);
                        const gameId = target.dataset.gameId;
                        const nextGame = allGames.find((item) => item.id === gameId);
                        if (!nextGame) return;

                        loadImages([nextGame]).then(() => {
                            if (imageUrls[nextGame.id]) {
                                target.src = imageUrls[nextGame.id];
                            }
                        });
                    }
                }, { root: grid, rootMargin: "260px" });
            }

            image.dataset.gameId = game.id;
            imageObserver.observe(image);
        }

        function getVisibleGames() {
            const query = searchInput.value.trim().toLowerCase();
            const category = categoryFilter.value;

            return allGames.filter((game) => {
                const matchesSearch = !query || game.name.toLowerCase().includes(query);
                const matchesCategory = !category || game.category === category;
                return matchesSearch && matchesCategory;
            });
        }

        function openInResearch(url) {
            if (!url) return;
            const target = unwrapLaunchTarget(url);
            const destination = `${getStaticPageUrl("research.html")}?goto=${encodeURIComponent(target)}`;
            const handoff = getLoadingHandoffUrl(destination);
            try {
                window.parent.location.href = handoff;
            } catch {
                window.location.href = handoff;
            }
        }

        async function ensureLuminReady() {
            if (!window.Lumin) await loadLuminSdk();
            if (!luminReady) {
                await Lumin.init({ headless: true });
                luminReady = true;
            }
        }

        async function playGame(game) {
            if (!game) return;
            showGameLoader();

            const directUrl = game.html_url || game.url || game.link || game.src || game.href;
            if (directUrl) {
                setStatus(`Opening ${game.name}...`);
                openInResearch(directUrl);
                return;
            }

            try {
                setStatus(`Opening ${game.name}...`);
                await ensureLuminReady();
                const result = await withTimeout(Lumin.getGameUrl(game.id), 20000, "Game link took too long to load.");
                const url = result?.url || result;
                if (!url) throw new Error("Lumin did not return a game URL.");
                openInResearch(url);
            } catch (err) {
                hideGameLoader();
                console.error("Game launch failed:", err);
                setStatus("Could not open game.");
            }
        }

        function renderGames(games) {
            grid.innerHTML = "";
            imageObserver?.disconnect();
            imageObserver = null;

            if (!games.length) {
                setStatus("No games found.");
                return;
            }

            const totalGames = allGames.length || luminTotalGames;
            setStatus(totalGames > games.length ? `${games.length} of ${totalGames} games` : `${games.length} games`);

            for (const game of games) {
                const card = document.createElement("button");
                card.className = "game-card";
                card.type = "button";
                card.dataset.gameId = game.id;
                card.addEventListener("click", (event) => {
                    event.preventDefault();
                    event.stopPropagation();
                    playGame(game);
                });

                const image = document.createElement("img");
                image.alt = game.name;
                image.onerror = () => {
                    image.onerror = null;
                    image.src = getFallbackImage(game);
                };
                if (imageUrls[game.id]) {
                    image.src = imageUrls[game.id];
                } else if (!game.image_token) {
                    image.src = getFallbackImage(game);
                }
                if (game.image_token && !imageUrls[game.id]) {
                    watchImage(image, game);
                }

                const title = document.createElement("span");
                title.textContent = game.name;

                card.append(image, title);
                grid.appendChild(card);
            }
        }

        async function refreshGames() {
            const games = getVisibleGames();
            renderGames(games);
        }

        async function initActivities() {
            showGameLoader();
            const cachedDirectory = getCachedLuminDirectory();
            if (cachedDirectory) {
                allGames = cachedDirectory.games;
                luminTotalGames = cachedDirectory.total || cachedDirectory.games.length;
                updateCategories(categoriesFromGames(allGames));
                refreshGames();
            }

            try {
                setStatus(cachedDirectory ? `${allGames.length} games` : "Loading Lumin games...");
                await withTimeout(loadLuminSdk(), 15000, "Lumin SDK took too long to load.");
                await withTimeout(Lumin.init({ headless: true }), 30000, "Lumin took too long to start.");
                luminReady = true;
                const firstPage = await withTimeout(getGamesPage(1), 30000, "Lumin games took too long to load.");
                allGames = firstPage.games;
                if (!allGames.length) throw new Error("Lumin returned no games.");
                usingFallbackGames = false;
                luminTotalPages = firstPage.pages;
                luminTotalGames = firstPage.total;
                setCachedLuminDirectory(allGames, luminTotalGames);

                let categories = normalizeCategories(await Lumin.getCategories().catch(() => []));
                if (!categories.length) {
                    categories = categoriesFromGames(allGames);
                }

                updateCategories(categories);
                await loadImages(allGames.slice(0, 24));
                refreshGames();
                hideGameLoader();
                loadGnMathGames().then(async (gnGames) => {
                    if (!mergeCatalogGames(gnGames)) return;
                    updateCategories(categoriesFromGames(allGames));
                    await loadImages(gnGames.slice(0, 24));
                    refreshGames();
                    setStatus(`${allGames.length} games`);
                }).catch((err) => {
                    console.error("GN Math catalog failed:", err);
                });
                loadRemainingLuminPages(2).catch((err) => {
                    console.error("More Lumin pages failed:", err);
                    setStatus(`${allGames.length} games loaded. More pages failed.`);
                });
                return;
            } catch (err) {
                console.error("LuminSDK error:", err);
                if (cachedDirectory) {
                    try {
                        const gnGames = await loadGnMathGames();
                        mergeCatalogGames(gnGames);
                        await loadImages(gnGames.slice(0, 24));
                        updateCategories(categoriesFromGames(allGames));
                        refreshGames();
                    } catch (gnErr) {
                        console.error("GN Math catalog failed:", gnErr);
                    }
                    setStatus(`${allGames.length} games`);
                    hideGameLoader();
                    return;
                }
                usingFallbackGames = false;
                allGames = [];
                luminTotalGames = 0;
                updateCategories([]);
                grid.innerHTML = "";
                try {
                    setStatus("Loading GN Math games...");
                    allGames = await loadGnMathGames();
                    await loadImages(allGames.slice(0, 24));
                    updateCategories(categoriesFromGames(allGames));
                    refreshGames();
                    hideGameLoader();
                } catch (gnErr) {
                    console.error("GN Math catalog failed:", gnErr);
                    setStatus("Game catalogs failed to load.");
                    hideGameLoader();
                }
            }
        }

        searchInput.addEventListener("input", refreshGames);
        categoryFilter.addEventListener("change", refreshGames);
        randomButton.addEventListener("click", async () => {
            setStatus("Loading random games...");

            if (!allGames.length && !window.Lumin) {
                setStatus("Game catalogs failed to load.");
                return;
            }

            const shuffled = [...allGames].sort(() => Math.random() - 0.5).slice(0, 20);
            await loadImages(shuffled);
            renderGames(shuffled);
        });

        window.addEventListener("beforeunload", () => {
            window.Lumin?.destroy?.();
        });

        initActivities();
    </script>
<script>
(() => {
    const store = window.localStorage;
    const bgMap = {
        default: '#121212 url("aether background.png") center / cover fixed no-repeat',
        night: 'linear-gradient(135deg, #050505, #122033 58%, #12051f) fixed',
        ocean: 'linear-gradient(135deg, #001219, #005f73, #0a9396) fixed',
        none: '#121212'
    };
    const custom = (store.getItem('aether.settings.customBg') || '').trim();
    const mode = store.getItem('aether.settings.bg') || 'default';
    const bg = custom ? `#121212 url("${custom.replace(/"/g, '%22')}") center / cover fixed no-repeat` : (bgMap[mode] || bgMap.default);
    document.documentElement.style.background = bg;
    document.body.style.background = bg;
    document.querySelectorAll('.settings-action').forEach(button => {
        button.addEventListener('click', () => { window.location.href = 'settings.html'; });
    });
})();
</script>
</body>
</html>
